[package]
name = "lasco-ffi"
version = "0.1.0"
edition = "2024"
description = "UniFFI bindings for Lasco's encrypted photo backup core"
license = "GPL-3.0-only"
repository = "https://github.com/lasco-app/lasco"
readme = "../README.md"
keywords = []
categories = []

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
lasco-core = { path = "../lasco-core" }
uniffi = { version = "0.29", features = ["cli"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
