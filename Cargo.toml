[workspace]
members = ["lasco-core", "lasco-ffi"]
resolver = "2"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# Apple security-scoped bookmarks and Android JNI require tiny, audited FFI
# boundaries. Individual modules must opt in explicitly with a safety comment.
unsafe_code = "deny"

[workspace.lints.clippy]
cargo       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
clone_on_ref_ptr                = "allow"
map_err_ignore                  = "allow"

undocumented_unsafe_blocks      = "warn"
unused_result_ok                = "warn"
redundant_type_annotations      = "warn"
empty_structs_with_brackets     = "warn"

# The workspace is an application/library hybrid, not a crates.io package. These
# checks depend on publish metadata and the fully resolved third-party graph.
cargo_common_metadata               = "allow"
multiple_crate_versions             = "allow"

# These APIs deliberately preserve ownership and async shapes across the FFI and
# storage boundaries. The remaining occurrences are intentional trade-offs rather
# than correctness defects.
needless_pass_by_value              = "allow"
unused_async                        = "allow"
too_many_arguments                  = "allow"
too_many_lines                      = "allow"

# Error mapping intentionally does not reveal cryptographic authentication
# details. The conversion and formatting instances are bounded by domain inputs.
missing_panics_doc                  = "allow"
cast_possible_truncation            = "allow"
cast_sign_loss                      = "allow"
format_collect                      = "allow"

# These are deliberate implementation details: compact domain enums, redacted
# debug output, shared-pointer cloning, platform-neutral extension matching, and
# local test imports.
large_enum_variant                  = "allow"
missing_fields_in_debug             = "allow"
case_sensitive_file_extension_comparisons = "allow"
items_after_statements              = "allow"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = 1
