[package]
name = "lasco-core"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
thiserror = "2"
async-trait = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "macros"] }
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
rustc-hash = "2"
keyring = "3"
rust-s3 = "0.35"
base64 = "0.21"
walkdir = "2"
blake3 = "1"
http = "0.2"
directories = "5"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
