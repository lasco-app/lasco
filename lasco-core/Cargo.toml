[package]
name = "lasco-core"
version = "0.1.0"
edition = "2024"
description = "Core library for Lasco, an end-to-end encrypted photo backup application"
license = "GPL-3.0-only"
repository = "https://github.com/lasco-app/lasco"
readme = "../README.md"
keywords = []
categories = []

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
redundant_type_annotations = "warn"
empty_structs_with_brackets = "warn"
too_many_lines = "warn"
large_enum_variant = "allow"
missing_fields_in_debug = "allow"
case_sensitive_file_extension_comparisons = "allow"
items_after_statements = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
thiserror = "2"
async-trait = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
rustc-hash = "2"
# Use Keyring's provider API directly: the convenience `keyring::Entry` API
# intentionally has no default iOS backend.
keyring = "4"
keyring-core = "1"
rust-s3 = "0.37.2"
base64 = "0.22"
walkdir = "2"
blake3 = "1"
directories = "6"
tempfile = "3"
futures-util = "0.3"

# On Android rust-s3 uses native-tls which links OpenSSL, and there is no system
# OpenSSL for the android targets. Build OpenSSL from source there via the vendored
# feature. This dependency is compiled only for android so Apple keeps using
# Secure Transport and is untouched.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
jni = "0.21"
android-native-keyring-store = "1.0.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
# Keyring's iOS backend uses the protected-data store; enable its required
# feature explicitly because keyring's default feature set only enables the
# macOS-compatible keychain backend.
apple-native-keyring-store = { version = "1", features = ["protected"] }

[dev-dependencies]
proptest = "1"
uuid = { version = "1", features = ["v4"] }
